aid: 35pharma
name: 35Pharma
description: '35Pharma is a Canada-based, private, clinical-stage biopharmaceutical
  company headquartered in Montreal, Quebec, with a research hub in Boston, Massachusetts.
  It designs and develops next-generation protein-based therapeutics — multi-specific
  Activin x GDF ligand traps engineered against the TGF-beta superfamily — for pulmonary
  hypertension, heart failure, cardiometabolic disease and obesity. Its lead program,
  HS235, is a precision-engineered activin signalling inhibitor that has completed
  Phase I healthy-volunteer studies and is entering proof-of-principle trials in PAH
  and PH-HFpEF; a second program, HS370, targets heart failure and obesity. 35Pharma
  publishes no developer program, API, or machine-readable API artifacts of any kind
  — it is a therapeutics developer, not a software or data provider. On 25 February
  2026 the company announced an agreement to be acquired by GSK plc.'
